<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>YouFlix TV</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; overflow: hidden; }
        
        /* Navbar */
        nav { background: #000; padding: 0 5%; display: flex; align-items: center; justify-content: space-between; position: fixed; width: 100%; z-index: 1000; box-sizing: border-box; height: 60px; border-bottom: 1px solid #333; }
        .logo { color: var(--primary); font-size: 22px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { font-size: 15px; color: #aaa; cursor: pointer; padding: 5px 12px; border-radius: 4px; outline: none; border: 2px solid transparent; text-decoration: none; }
        .nav-link:focus, .nav-link.active { color: white; background: rgba(255,255,255,0.15); border-color: var(--primary); }

        .content { height: 100vh; overflow-y: auto; padding: 80px 0 30px 0; box-sizing: border-box; }
        .genre-row { padding-left: 5%; margin-bottom: 25px; }
        .genre-title { font-size: 1.2rem; margin-bottom: 10px; font-weight: 600; color: #efefef; }

        /* Slider ve Kartlar */
        .slider { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth; }
        .slider::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 150px; max-width: 150px; outline: none; border: 2px solid transparent; border-radius: 8px; transition: transform 0.3s; background: #141414; cursor: pointer; }
        .movie-card img { width: 100%; height: 210px; object-fit: cover; border-radius: 6px; }
        .movie-card:focus { transform: scale(1.08); border-color: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .movie-name { font-size: 13px; margin: 8px 0; text-align: center; height: 32px; overflow: hidden; color: #bbb; padding: 0 5px; }

        /* Detay Görünümü - Sığma Sorunu Giderildi */
        #detailView { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; overflow-y: auto; }
        .detail-banner { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0.4; z-index: -1; }
        .detail-info { padding: 70px 7% 50px 7%; max-width: 90%; position: relative; z-index: 2100; box-sizing: border-box; }
        
        /* Akıllı Yazı Boyutları */
        .detail-title { font-size: clamp(22px, 5vw, 48px); margin: 10px 0; font-weight: 800; line-height: 1.2; }
        .detail-desc { font-size: clamp(14px, 2vw, 18px); line-height: 1.6; color: #ddd; margin: 15px 0; max-height: 20vh; overflow-y: auto; padding-right: 10px; }
        .detail-desc::-webkit-scrollbar { width: 4px; }
        .detail-desc::-webkit-scrollbar-thumb { background: #444; }

        .play-btn { background: #fff; color: #000; border: none; padding: 12px 35px; font-size: 18px; font-weight: bold; border-radius: 4px; outline: none; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-top: 20px; transition: 0.2s; }
        .play-btn:focus { background: var(--primary); color: #fff; transform: scale(1.1); }

        /* Video Player */
        #player { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 5000; display: none; }
        #player iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body onkeydown="handleGlobalKeys(event)">

<nav>
    <div class="logo">YouFlix</div>
    <div class="nav-link active" id="hLink" tabindex="1" onclick="showHome()">Ana Sayfa</div>
</nav>

<div id="mainContent" class="content"></div>
<div id="detailView"><div id="detailDynamic"></div></div>
<div id="player"><div id="videoContainer"></div></div>

<script>
    let movies = [];

    function loadDatabase() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "youtube_filmleri_pro_database.json", true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                movies = JSON.parse(xhr.responseText);
                showHome();
            }
        };
        xhr.send();
    }

    function showHome() {
        const container = document.getElementById('mainContent');
        container.innerHTML = '';
        const genres = {};
        
        movies.forEach(m => {
            if (m.tur) {
                m.tur.split(',').forEach(t => {
                    const tur = t.trim();
                    if(!genres[tur]) genres[tur] = [];
                    genres[tur].push(m);
                });
            }
        });

        Object.keys(genres).sort().forEach(genre => {
            const row = document.createElement('div');
            row.className = 'genre-row';
            row.innerHTML = `<div class="genre-title">${genre}</div><div class="slider">${genres[genre].map(m => `
                <div class="movie-card" tabindex="2" onclick="openDetail(${m.film_id})">
                    <img data-src="${m.poster || m.yt_poster}" class="lazy-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
                    <div class="movie-name">${m.film_adi}</div>
                </div>`).join('')}</div>`;
            container.appendChild(row);
        });

        initLazyLoading();
        setTimeout(() => document.querySelector('.movie-card')?.focus(), 500);
    }

    function initLazyLoading() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    if(img.dataset.src) img.src = img.dataset.src;
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '0px 1000px 0px 1000px' });
        document.querySelectorAll('.lazy-img').forEach(img => observer.observe(img));
    }

    function openDetail(id) {
        const m = movies.find(x => x.film_id === id);
        const ytId = m.yt_link.split('v=')[1];
        
        document.getElementById('detailDynamic').innerHTML = `
            <div class="detail-banner" style="background-image: url('${m.afis || m.yt_poster}')"></div>
            <div class="detail-info">
                <div style="color:var(--primary); font-weight:bold; font-size:14px; margin-bottom:5px;">⭐ ${m.puan || 'N/A'} | ${m.kategori || ''}</div>
                <h1 class="detail-title">${m.film_adi}</h1>
                <p class="detail-desc">${m.ozet || 'Özet bulunamadı.'}</p>
                <button id="playBtn" class="play-btn" tabindex="3" onclick="startVideo('${ytId}')">
                    <i class="fas fa-play"></i> OYNAT
                </button>
            </div>`;
        
        document.getElementById('detailView').style.display = 'block';
        setTimeout(() => {
            const btn = document.getElementById('playBtn');
            btn.focus();
            document.getElementById('detailView').scrollTo({top: 0, behavior: 'smooth'});
        }, 150);
    }

    function startVideo(id) {
        document.getElementById('player').style.display = 'block';
        const origin = window.location.origin;
        const ytUrl = `https://www.youtube.com/embed/${id}?autoplay=1&origin=${origin}&enablejsapi=1&rel=0`;
        document.getElementById('videoContainer').innerHTML = `<iframe src="${ytUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    function handleGlobalKeys(e) {
        if (e.key === "Backspace" || e.key === "Escape") {
            if (document.getElementById('player').style.display === 'block') {
                document.getElementById('player').style.display = 'none';
                document.getElementById('videoContainer').innerHTML = '';
                document.getElementById('playBtn').focus();
            } else if (document.getElementById('detailView').style.display === 'block') {
                document.getElementById('detailView').style.display = 'none';
                document.querySelector('.movie-card:focus')?.focus();
            }
        }
    }

    loadDatabase();
</script>
</body>
</html>
