<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YouFlix TV</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #e50914; --bg: #000; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; overflow: hidden; }
        nav { background: #000; padding: 0 5%; display: flex; align-items: center; position: fixed; width: 100%; z-index: 1000; height: 60px; border-bottom: 1px solid #222; box-sizing: border-box; }
        .logo { color: var(--primary); font-size: 22px; font-weight: bold; }
        .content { height: 100vh; overflow-y: auto; padding-top: 70px; box-sizing: border-box; }
        .genre-row { padding-left: 5%; margin-bottom: 25px; }
        .genre-title { font-size: 1.1rem; margin-bottom: 10px; font-weight: bold; color: #ddd; }
        .slider { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; }
        .slider::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 150px; outline: none; border: 2px solid transparent; border-radius: 4px; background: #111; cursor: pointer; transition: 0.3s; }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; }
        .movie-card:focus { transform: scale(1.05); border-color: white; }
        .movie-name { font-size: 13px; text-align: center; height: 34px; overflow: hidden; color: #aaa; padding: 5px; }
        #detailView { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; }
        .detail-banner { position: absolute; width: 100%; height: 100%; background-size: cover; opacity: 0.4; z-index: -1; }
        .detail-info { position: relative; height: 100%; padding: 0 8%; display: flex; flex-direction: column; justify-content: center; gap: 15px; background: linear-gradient(to right, #000 40%, transparent 100%); }
        .detail-title { font-size: clamp(24px, 5vw, 40px); font-weight: bold; margin: 0; }
        .detail-desc { font-size: 16px; color: #ccc; max-width: 500px; max-height: 100px; overflow-y: auto; }
        .play-btn { background: white; color: black; border: none; padding: 12px 40px; font-size: 18px; font-weight: bold; border-radius: 4px; outline: none; cursor: pointer; }
        .play-btn:focus { background: var(--primary); color: white; }
        /* Oynatıcı Katmanı */
        #playerLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 5000; display: none; }
        #ytPlayer { width: 100%; height: 100%; }
    </style>
</head>
<body onkeydown="handleGlobalKeys(event)">

<nav><div class="logo">YouFlix</div></nav>
<div id="mainContent" class="content"></div>
<div id="detailView"><div id="detailDynamic"></div></div>

<div id="playerLayer"><div id="ytPlayer"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let movies = [];
    let player;

    // API hazır olduğunda boş bir player oluşturur
    function onYouTubeIframeAPIReady() {
        console.log("YouTube API Hazır");
    }

    function loadDatabase() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "youtube_filmleri_pro_database.json", true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                movies = JSON.parse(xhr.responseText);
                showHome();
            }
        };
        xhr.send();
    }

    function showHome() {
        const container = document.getElementById('mainContent');
        container.innerHTML = '';
        const genres = {};
        movies.forEach(m => {
            if (m.tur) {
                m.tur.split(',').forEach(t => {
                    const tur = t.trim();
                    if(!genres[tur]) genres[tur] = [];
                    genres[tur].push(m);
                });
            }
        });
        Object.keys(genres).sort().forEach(genre => {
            const row = document.createElement('div');
            row.className = 'genre-row';
            row.innerHTML = `<div class="genre-title">${genre}</div><div class="slider">${genres[genre].map(m => `
                <div class="movie-card" tabindex="1" onclick="openDetail(${m.film_id})">
                    <img src="${m.poster || m.yt_poster}">
                    <div class="movie-name">${m.film_adi}</div>
                </div>`).join('')}</div>`;
            container.appendChild(row);
        });
    }

    function openDetail(id) {
        const m = movies.find(x => x.film_id === id);
        const ytId = m.yt_link.split('v=')[1];
        document.getElementById('detailDynamic').innerHTML = `
            <div class="detail-banner" style="background-image: url('${m.afis || m.yt_poster}')"></div>
            <div class="detail-info">
                <h1 class="detail-title">${m.film_adi}</h1>
                <p class="detail-desc">${m.ozet || ''}</p>
                <button id="playBtn" class="play-btn" tabindex="2" onclick="startVideo('${ytId}')">OYNAT</button>
            </div>`;
        document.getElementById('detailView').style.display = 'block';
        setTimeout(() => document.getElementById('playBtn').focus(), 150);
    }

    function startVideo(videoId) {
        document.getElementById('playerLayer').style.display = 'block';
        
        // Eğer player zaten varsa yok et ve yenisini oluştur (153 hatasını önler)
        if (player) { player.destroy(); }

        player = new YT.Player('ytPlayer', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: {
                'autoplay': 1,
                'origin': window.location.origin,
                'enablejsapi': 1,
                'rel': 0
            },
            events: {
                'onReady': (event) => event.target.playVideo(),
                'onError': (e) => alert("Hata Kodu: " + e.data) // Hata 150/153 ise burada yakalanır
            }
        });
    }

    function handleGlobalKeys(e) {
        if (e.key === "Backspace" || e.key === "Escape") {
            if (document.getElementById('playerLayer').style.display === 'block') {
                if(player) player.stopVideo();
                document.getElementById('playerLayer').style.display = 'none';
                document.getElementById('playBtn').focus();
            } else if (document.getElementById('detailView').style.display === 'block') {
                document.getElementById('detailView').style.display = 'none';
            }
        }
    }
    loadDatabase();
</script>
</body>
</html>
