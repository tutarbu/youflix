<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>YouFlix TV</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: Arial, sans-serif; margin: 0; overflow: hidden; }
        
        /* Navbar */
        nav { background: #000; padding: 15px 5%; display: flex; align-items: center; gap: 30px; position: fixed; width: 100%; z-index: 1000; box-sizing: border-box; height: 70px; }
        .logo { color: var(--primary); font-size: 28px; font-weight: bold; }
        .nav-link { font-size: 18px; color: #888; cursor: pointer; padding: 8px 15px; border-radius: 4px; outline: none; border: 2px solid transparent; }
        .nav-link:focus, .nav-link.active { color: white; background: rgba(255,255,255,0.1); border-color: var(--primary); }

        .content { height: 100vh; overflow-y: auto; padding-top: 80px; box-sizing: border-box; }
        .genre-row { padding-left: 5%; margin-bottom: 25px; }
        .genre-title { font-size: 20px; margin-bottom: 10px; font-weight: bold; color: #e5e5e5; }

        /* Slider ve Kompakt Kartlar */
        .slider { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth; scroll-snap-type: x mandatory; }
        .slider::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 170px; max-width: 170px; outline: none; border: 3px solid transparent; border-radius: 6px; transition: 0.2s; background: #1a1a1a; scroll-snap-align: start; cursor: pointer; }
        .movie-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; opacity: 0; transition: opacity 0.4s; }
        .movie-card:focus { transform: scale(1.08); border-color: white; z-index: 10; }
        .movie-name { font-size: 14px; margin-top: 8px; text-align: center; height: 35px; overflow: hidden; color: #ccc; padding: 0 5px; }

        /* Full Screen Player & Detail */
        #detailView { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; }
        .detail-banner { height: 100vh; background-size: cover; background-position: center; opacity: 0.3; }
        .detail-info { position: absolute; top: 15%; left: 6%; z-index: 2100; max-width: 50%; }
        #player { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 5000; display: none; }
        #player iframe { width: 100%; height: 100%; border: none; }
        
        .play-btn { background: white; color: black; border: none; padding: 15px 50px; font-size: 22px; font-weight: bold; border-radius: 5px; outline: none; cursor: pointer; margin-top: 20px; }
        .play-btn:focus { background: var(--primary); color: white; }
    </style>
</head>
<body onkeydown="handleGlobalKeys(event)">

<nav>
    <div class="logo">YouFlix</div>
    <div class="nav-link active" id="hLink" tabindex="1" onclick="showHome()">Ana Sayfa</div>
</nav>

<div id="mainContent" class="content"></div>
<div id="detailView"><div id="detailDynamic"></div></div>
<div id="player"><div id="videoContainer" style="width: 100%; height: 100%;"></div></div>

<script>
    let movies = [];

    // Veritabanını GitHub üzerinden yükle
    function loadDatabase() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "youtube_filmleri_pro_database.json", true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
                movies = JSON.parse(xhr.responseText);
                showHome();
            }
        };
        xhr.send();
    }

    function showHome() {
        const container = document.getElementById('mainContent');
        container.innerHTML = '';
        const genres = {};
        
        // Türleri kategorize et
        movies.forEach(m => {
            if (m.tur) {
                m.tur.split(',').forEach(t => {
                    const tur = t.trim();
                    if(!genres[tur]) genres[tur] = [];
                    genres[tur].push(m);
                });
            }
        });

        Object.keys(genres).sort().forEach(genre => {
            const row = document.createElement('div');
            row.className = 'genre-row';
            row.innerHTML = `<div class="genre-title">${genre}</div><div class="slider">${genres[genre].map(m => `
                <div class="movie-card" tabindex="2" onclick="openDetail(${m.film_id})">
                    <img data-src="${m.poster || m.yt_poster}" class="lazy-img" onload="this.style.opacity=1">
                    <div class="movie-name">${m.film_adi}</div>
                </div>`).join('')}</div>`;
            container.appendChild(row);
        });

        initLazyLoading();
        // İlk karta odaklan
        setTimeout(() => document.querySelector('.movie-card')?.focus(), 500);
    }

    function initLazyLoading() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '0px 1000px 0px 1000px' });
        document.querySelectorAll('.lazy-img').forEach(img => observer.observe(img));
    }

    function openDetail(id) {
        const m = movies.find(x => x.film_id === id);
        const ytId = m.yt_link.split('v=')[1];
        document.getElementById('detailDynamic').innerHTML = `
            <div class="detail-banner" style="background-image: url('${m.afis || m.yt_poster}')"></div>
            <div class="detail-info">
                <h1 style="font-size: 45px; margin:0;">${m.film_adi}</h1>
                <p style="font-size: 18px; line-height: 1.4; margin: 20px 0;">${m.ozet || 'Özet bulunamadı.'}</p>
                <button id="playBtn" class="play-btn" tabindex="3" onclick="startVideo('${ytId}')">OYNAT</button>
            </div>`;
        document.getElementById('detailView').style.display = 'block';
        document.getElementById('playBtn').focus();
    }

    function startVideo(id) {
        document.getElementById('player').style.display = 'block';
        // 153 HATASI İÇİN EN ÖNEMLİ ADRES DOĞRULAMASI
        const origin = window.location.origin;
        const ytUrl = `https://www.youtube.com/embed/${id}?autoplay=1&origin=${origin}&enablejsapi=1&rel=0&widget_referrer=${origin}`;
        
        document.getElementById('videoContainer').innerHTML = `
            <iframe src="${ytUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        `;
    }

    function handleGlobalKeys(e) {
        // Geri tuşu (Backspace) veya Escape
        if (e.key === "Backspace" || e.key === "Escape") {
            if (document.getElementById('player').style.display === 'block') {
                document.getElementById('player').style.display = 'none';
                document.getElementById('videoContainer').innerHTML = '';
                document.getElementById('playBtn').focus();
            } else if (document.getElementById('detailView').style.display === 'block') {
                document.getElementById('detailView').style.display = 'none';
                document.querySelector('.movie-card:focus')?.focus();
            }
        }
    }

    loadDatabase();
</script>
</body>
</html>
